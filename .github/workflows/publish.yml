name: Publish
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: stevezhu/actions/npm-publish@8da25b89202307b8a88091dac8f9e2fcf830a818 # v3.0.0
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
